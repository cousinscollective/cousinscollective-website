/* ─── BOOKING HELPERS ─── */
function getWeekdays(daysAhead) {
  const days = [];
  const start = new Date();
  for (let i = 1; i <= daysAhead; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) {
      days.push({
        iso: d.toISOString().slice(0,10),
        day: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dow],
        num: d.getDate(),
        month: d.toLocaleString("default", { month: "short" }),
      });
    }
  }
  return days;
}

function generateMockSlots(dates) {
  const pool = ["9:00 AM","9:20 AM","9:40 AM","10:00 AM","10:20 AM","10:40 AM","11:00 AM","11:20 AM","11:40 AM","1:00 PM","1:20 PM","1:40 PM","2:00 PM","2:20 PM","2:40 PM","3:00 PM","3:20 PM","3:40 PM","4:00 PM","4:20 PM","4:40 PM"];
  const result = {};
  dates.forEach((d, i) => {
    if (i % 6 === 5) { result[d.iso] = []; return; }
    result[d.iso] = pool.map((t, idx) => ({
      time: t,
      available: !((idx + i) % 4 === 0),
    }));
  });
  return result;
}

async function fetchSlots() {
  const dates = getWeekdays(BOOKING_WINDOW);
  if (!SCRIPT_URL || SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") {
    return generateMockSlots(dates);
  }
  try {
    const r = await fetch(`${SCRIPT_URL}?action=availability`);
    const json = await r.json();
    return json.slots || generateMockSlots(dates);
  } catch(e) {
    return generateMockSlots(dates);
  }
}

function formatBookedTime(iso, time) {
  const d = new Date(iso + "T12:00:00");
  return `${d.toLocaleString("default",{weekday:"long"})}, ${d.toLocaleString("default",{month:"long"})} ${d.getDate()}, ${d.getFullYear()} at ${time} CST`;
}

    preferred_comms:"", response_expectations:"", working_hours:"",
    update_cadence:"", file_storage:"",
    success_90_days:"", delegation_concerns:"", tried_before:"", anything_else:"",
    meet_format:"", timezone:"", hear_about:"",
    bookedDate:"", bookedTime:"", bookedDateTime:"",
  });

  // Booking state
  const [selectedDate, setSelectedDate] = useState(null);
  const [selectedTime, setSelectedTime] = useState(null);
  const [slots, setSlots] = useState(null);

  const set  = (k,v) => setD(p=>({...p,[k]:v}));
  const setV = (k,v) => setD(p=>({...p,vdata:{...p.vdata,[k]:v}}));
  const vi   = VERTICALS.find(v=>v.id===d.vertical);
  const vqs  = VQS[d.vertical]||[];

  // Fetch slots when entering step 9
  useEffect(() => {
    if (step === 9 && !slots) {
      fetchSlots().then(setSlots);
    }
  }, [step]);

  const canNext = () => {
    if(step===1) return !!d.vertical;
    if(step===2) {
      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);
      return !!(d.first_name && d.last_name && d.email && emailValid && d.phone && d.business_name);
    }
    if(step===3) return !!(d.tools.length > 0 && d.pain_points.trim());
    if(step===4) return !!(d.vdata[vqs[0]?.id] || "").trim();
    if(step===5) return !!(d.services_needed.length > 0 && d.tier);
    if(step===6) return !!(d.preferred_comms && d.response_expectations);
    if(step===7) return !!d.success_90_days.trim();
    if(step===8) return !!(d.meet_format && d.timezone && d.hear_about);
    if(step===9) return !!(selectedDate && selectedTime);
    return true;
  };

  const submitForm = async () => {
    if (!SCRIPT_URL || SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") return;
    const { vdata, ...rest } = d;
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "submit",
          ...rest,
          ...vdata,
          contact_name: `${d.first_name} ${d.last_name}`.trim(),
        }),
      });
    } catch(e) { /* silent */ }
  };

  const submitBooking = async (iso, time, fmtTime) => {
    if (!SCRIPT_URL || SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") return;
    const { vdata, ...rest } = d;
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "book",
          ...rest,
          ...vdata,
          contact_name: `${d.first_name} ${d.last_name}`.trim(),
          bookedDate: iso,
          bookedTime: time,
          bookedDateTime: fmtTime,
        }),
      });
    } catch(e) { /* silent */ }
  };

  const go = async dir => {
    if(dir===1&&!canNext()) return;

    // Step 8 → submit form, advance to Step 9 (booking)
    if(dir===1 && step===8) {
      setSubmitting(true);
      await submitForm();
      setSubmitting(false);
      setStep(9);
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }

    // Step 9 → confirm booking, advance to confirmation
    if(dir===1 && step===9) {
      const fmtTime = formatBookedTime(selectedDate, selectedTime);
      setSubmitting(true);
      await submitBooking(selectedDate, selectedTime, fmtTime);
      setD(p => ({ ...p, bookedDate: selectedDate, bookedTime: selectedTime, bookedDateTime: fmtTime }));
      setSubmitting(false);
      setDone(true);
      return;
    }

    const next = Math.max(0,Math.min(STEPS.length-1,step+dir));
    setStep(next);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  if(done) return <Confirmation d={d} vi={vi}/>;

  /* progress */

        <div style={{display:"flex",flexDirection:"column",gap:10,maxWidth:340,margin:"0 auto 32px",padding:"20px 24px",background:"rgba(234,224,206,0.5)",borderRadius:8,textAlign:"left"}}>

        <div style={{marginTop:20,fontSize:11,color:B.fog,fontFamily:'"DM Sans",system-ui,sans-serif',letterSpacing:"0.06em",textTransform:"uppercase"}}>
          Cousins Collective · hello@cousinscollective.net
        </div>
      </div>
    );

    /* 1 · VERTICAL */
    if(step===1) return (
      <div>
        <StepHead tag="Step 1 of 9 · Your Business" title="What type of business do you run?" sub="Select the category that best fits your practice."/>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>

        <FG><Lbl req>Services needed <em style={{fontWeight:400}}>(select all)</em></Lbl><CheckGrid opts={SERVICES} sel={d.services_needed} onChange={v=>set("services_needed",v)} cols={2}/></FG>

                    <div key={dx.iso}
                      onClick={()=>{ if(!hasSlots) return; setSelectedDate(dx.iso); setSelectedTime(null); }}

              {selectedDate && (

                  <div style={{fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",color:B.goldDk,fontWeight:500,fontFamily:'"DM Sans",system-ui,sans-serif',marginBottom:12,display:"flex",alignItems:"center",gap:10}}>

                          style={{

                </>

                Need a different time? Reply to your confirmation email and we'll find one.
              </p>
            </>
          )}
        </div>
      );
    }

    return null;
  };

  return (
    <div style={{minHeight:"100vh",background:B.cream,fontFamily:'"DM Sans",system-ui,sans-serif',paddingBottom:80}}>

            <div style={{fontSize:10,color:B.fog,letterSpacing:"0.1em",textTransform:"uppercase",marginTop:1}}>Business Solution Consultation</div>
          </div>
        </a>
        <div style={{fontSize:10,letterSpacing:"0.12em",textTransform:"uppercase",color:B.gold,fontWeight:500}}>cousinscollective.net</div>
      </div>

      {/* Form */}
      <div style={{maxWidth:680,margin:"0 auto",padding:"32px 20px 0"}}>
        {step>0&&(
          <div style={{marginBottom:32}}>
            <div style={{height:2,background:B.birch,borderRadius:1,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:B.gold,borderRadius:1,transition:"width 0.5s ease"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
              <span style={{fontSize:11,color:B.fog,fontFamily:'"DM Sans",system-ui,sans-serif'}}>Step {step} of {TOTAL_STEPS}</span>

            </div>
          </div>
        )}

        <div style={{background:B.white,borderRadius:10,padding:"32px 28px 28px",boxShadow:"0 2px 24px rgba(13,27,42,0.07)",minHeight:400,borderTop:`3px solid ${step===0?B.gold:B.birch}`}}>
          {renderStep()}
        </div>

        {step>0&&(
          <div style={{display:"flex",gap:12,marginTop:16}}>
            <button onClick={()=>go(-1)} disabled={submitting} style={{padding:"12px 24px",background:B.white,color:B.navy,border:`1.5px solid ${B.birch}`,borderRadius:6,fontSize:14,fontWeight:500,cursor:submitting?"not-allowed":"pointer",fontFamily:'"DM Sans",system-ui,sans-serif',opacity:submitting?0.5:1}}>← Back</button>
            {(() => {
              const ready = canNext() && !submitting;
              const useGold = step===8 || step===9;
              return (
                <button onClick={()=>go(1)} disabled={!ready} style={{
                  flex:1,
                  padding:"13px",
                  fontSize:14,
                  fontWeight:600,
                  cursor: ready ? "pointer" : "not-allowed",
                  background: useGold ? B.gold : B.navy,
                  color: useGold ? B.navy : B.white,
                  opacity: ready ? 1 : 0.32,
                  border: "none",
                  borderRadius: 6,
                  fontFamily: '"DM Sans",system-ui,sans-serif',
                  letterSpacing: "0.03em",
                  transition: "opacity 0.25s ease, background 0.2s ease"
                }}>
                  {submitting ? "Processing…" : step===8 ? "Submit & Request Consultation →" : step===9 ? "Confirm Your Booking →" : "Continue →"}
                </button>
              );
            })()}
          </div>
        )}

        <div style={{marginTop:28,display:"flex",justifyContent:"center",gap:24,flexWrap:"wrap"}}>
          {["🔒 Strictly confidential","⚡ 1 business day response"].map(t=>(
            <span key={t} style={{fontSize:11.5,color:B.fog,fontFamily:'"DM Sans",system-ui,sans-serif'}}>{t}</span>
          ))}
        </div>
      </div>
    </div>
  );
}
